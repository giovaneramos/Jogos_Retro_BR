name: Build PS4 / PS5 Homebrew PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_pkg:
    name: Compilar e Gerar PKG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Compilador LLVM 18 e LLD
        run: |
          echo "==> Configurando Clang 18 e LLD 18..."
          if ! command -v clang++-18 >/dev/null 2>&1 || ! command -v ld.lld-18 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang-18 lld-18
          fi
          sudo ln -sf $(which clang-18) /usr/local/bin/clang
          sudo ln -sf $(which clang++-18) /usr/local/bin/clang++
          sudo ln -sf $(which ld.lld-18 2>/dev/null || which ld.lld) /usr/local/bin/ld.lld
          echo "Compilador:"
          clang++ --version
          echo "Linker:"
          ld.lld --version

      - name: Baixar e Configurar OpenOrbis PS4 Toolchain
        run: |
          echo "==> Instalando suporte a libssl1.1 para o PkgTool.Core (.NET Core)..."
          curl -fsSL -o /tmp/libssl1.1.deb http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb || \
          curl -fsSL -o /tmp/libssl1.1.deb http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb || true
          if [ -f /tmp/libssl1.1.deb ]; then
            sudo dpkg -i /tmp/libssl1.1.deb || true
          fi
          echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> $GITHUB_ENV

          echo "==> Baixando OpenOrbis PS4 Toolchain v0.5.4 oficial..."
          mkdir -p $HOME/OpenOrbis
          curl -fSL -o /tmp/toolchain.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          tar -xzf /tmp/toolchain.tar.gz -C $HOME/OpenOrbis

          # Localiza a raiz exata da toolchain procurando por link.x
          TC_ROOT=$(find $HOME/OpenOrbis -type f -name "link.x" -exec dirname {} \; | head -n 1)
          if [ -z "$TC_ROOT" ]; then
            TC_ROOT="$HOME/OpenOrbis/OpenOrbis/PS4Toolchain"
          fi

          echo "Diretório da Toolchain: $TC_ROOT"
          chmod -R +x "$TC_ROOT/bin" 2>/dev/null || true
          ls -la "$TC_ROOT"
          ls -la "$TC_ROOT/bin/linux"

          echo "==> Validando execução do PkgTool.Core..."
          "$TC_ROOT/bin/linux/PkgTool.Core" version || "$TC_ROOT/bin/linux/PkgTool.Core" --help || echo "Aviso: verificação inicial retornou código não-zero"

          echo "OO_PS4_TOOLCHAIN=$TC_ROOT" >> $GITHUB_ENV
          echo "$TC_ROOT/bin/linux" >> $GITHUB_PATH

      - name: Compilar Código e Montar Staging
        run: |
          echo "==> Iniciando compilação (make stage)..."
          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"
          if ! make stage 2>&1 | tee /tmp/make_stage.log; then
            echo "::error title=Falha no make stage::$(tail -n 5 /tmp/make_stage.log | tr '\n' ' ' | tr -d '\"')"
            echo "### ❌ Log de Erro no make stage:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/make_stage.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Construir Pacote .PKG
        run: |
          echo "==> Empacotando .pkg com PkgTool.Core..."
          if ! make pkg 2>&1 | tee /tmp/make_pkg.log; then
            echo "::error title=Falha no make pkg::$(tail -n 5 /tmp/make_pkg.log | tr '\n' ' ' | tr -d '\"')"
            echo "### ❌ Log de Erro no make pkg:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/make_pkg.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "==> Arquivos gerados em dist/:"
          ls -lh dist/

      - name: Publicar Arquivo .PKG e Artefatos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RetroPlayer_PS4_PS5_PKG
          path: |
            dist/*.pkg
            build/stage/eboot.bin
            sce_sys/param.sfo
            sce_sys/icon0.png
            sce_sys/pic1.png

      - name: Publicar Logs de Diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build_Logs
          path: /tmp/*.log

      - name: Resumo do Build
        if: always()
        run: |
          echo "### Resumo da Construção do PKG" >> $GITHUB_STEP_SUMMARY
          if [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
            echo " **Pacote .pkg gerado com sucesso!**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -lh dist >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pacote .pkg não foi encontrado em dist/**" >> $GITHUB_STEP_SUMMARY
          fi
