name: Build PS4 / PS5 Homebrew PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_pkg:
    name: Compilar e Gerar PKG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar LLD Linker
        run: |
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lld
          fi
          echo "Linker encontrado:"
          ld.lld --version

      - name: Baixar e Configurar OpenOrbis PS4 Toolchain
        run: |
          echo "==> Baixando OpenOrbis PS4 Toolchain v0.5.4 oficial..."
          mkdir -p $HOME/OpenOrbis
          curl -fSL -o /tmp/toolchain.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          tar -xzf /tmp/toolchain.tar.gz -C $HOME/OpenOrbis

          # Localiza a raiz exata da toolchain procurando por link.x
          TC_ROOT=$(find $HOME/OpenOrbis -type f -name "link.x" -exec dirname {} \; | head -n 1)
          if [ -z "$TC_ROOT" ]; then
            TC_ROOT="$HOME/OpenOrbis/OpenOrbis/PS4Toolchain"
          fi

          echo "Diretório da Toolchain: $TC_ROOT"
          chmod -R +x "$TC_ROOT/bin" 2>/dev/null || true
          ls -la "$TC_ROOT"
          ls -la "$TC_ROOT/bin/linux"

          echo "OO_PS4_TOOLCHAIN=$TC_ROOT" >> $GITHUB_ENV
          echo "$TC_ROOT/bin/linux" >> $GITHUB_PATH

      - name: Compilar Código e Montar Staging
        run: |
          echo "==> Compilando com a OpenOrbis Toolchain..."
          make stage

      - name: Construir Pacote .PKG
        run: |
          echo "==> Empacotando .pkg..."
          make pkg
          echo "==> Arquivos gerados em dist/:"
          ls -lh dist/

      - name: Publicar Arquivo .PKG e Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: RetroPlayer_PS4_PS5_PKG
          path: |
            dist/*.pkg
            build/stage/eboot.bin
            build/stage/sce_sys/param.sfo
            build/stage/sce_sys/icon0.png
